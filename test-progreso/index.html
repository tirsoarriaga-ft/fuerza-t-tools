<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0B0B0D">
<title>¿Estás entrenando o estás progresando? · Fuerza T</title>
<meta name="description" content="Autoevaluación gratuita: descubrí si estás entrenando o realmente progresando.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0B0D;
    --surface:#151519;
    --surface-2:#1C1C22;
    --line:#2A2A31;
    --text:#F4F2EE;
    --muted:#8E8E97;
    --accent:#F2601F;
    --accent-soft:rgba(242,96,31,.14);
    --accent-line:rgba(242,96,31,.35);
    --ok:#7BC96F;
    --radius:16px;
    --display:'Oswald',system-ui,sans-serif;
    --body:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--body);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    min-height:100dvh;
    display:flex;
    justify-content:center;
    padding:20px 18px calc(28px + env(safe-area-inset-bottom));
  }
  .app{
    width:100%;
    max-width:460px;
    display:flex;
    flex-direction:column;
  }

  /* Brand mark */
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:22px}
  .brand svg{display:block;width:30px;height:30px;flex:none}
  .brand span{
    font-family:var(--display);
    font-weight:600;
    letter-spacing:.14em;
    text-transform:uppercase;
    font-size:.82rem;
    color:var(--muted);
  }
  .brand b{color:var(--text);font-weight:600}

  /* Progress */
  .progress{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:26px}
  .progress .bar{height:100%;width:0;background:var(--accent);border-radius:2px;transition:width .35s cubic-bezier(.4,0,.2,1)}
  .progress.hidden{visibility:hidden}

  /* Screens */
  .screen{animation:enter .32s cubic-bezier(.2,.7,.3,1)}
  @keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  .eyebrow{
    font-family:var(--display);
    text-transform:uppercase;
    letter-spacing:.16em;
    font-size:.72rem;
    font-weight:600;
    color:var(--accent);
    margin-bottom:14px;
  }
  h1{
    font-family:var(--display);
    font-weight:700;
    text-transform:uppercase;
    font-size:2.05rem;
    line-height:1.05;
    letter-spacing:.01em;
    margin-bottom:16px;
  }
  h1 em{color:var(--accent);font-style:normal}
  .lead{color:var(--muted);font-size:1.02rem;margin-bottom:30px;max-width:36ch}

  /* Buttons */
  .btn{
    display:block;width:100%;
    font-family:var(--body);font-size:1.02rem;font-weight:600;
    color:var(--text);text-align:left;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:17px 18px;
    cursor:pointer;
    transition:border-color .18s,background .18s,transform .08s;
    -webkit-tap-highlight-color:transparent;
  }
  .btn:hover{border-color:var(--accent-line);background:var(--surface-2)}
  .btn:active{transform:scale(.985)}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .btn-primary{
    text-align:center;
    background:var(--accent);
    border-color:var(--accent);
    color:#120A05;
    font-weight:700;
    letter-spacing:.01em;
  }
  .btn-primary:hover{background:#ff6d2c;border-color:#ff6d2c}

  .btn-ghost{
    text-align:center;background:transparent;border-color:var(--line);color:var(--muted);
    font-weight:600;
  }
  .btn-ghost:hover{border-color:var(--accent-line);color:var(--text);background:transparent}

  /* Question layout */
  .qwrap{min-height:44vh;display:flex;flex-direction:column}
  .qtext{
    font-family:var(--display);font-weight:500;
    font-size:1.5rem;line-height:1.2;margin-bottom:28px;
  }
  .options{display:flex;flex-direction:column;gap:11px;margin-top:auto}
  .opt{display:flex;align-items:center;gap:14px}
  .opt .dot{
    width:9px;height:9px;border-radius:50%;background:var(--line);flex:none;transition:background .18s
  }
  .btn:hover .dot{background:var(--accent)}

  .back{
    background:none;border:none;color:var(--muted);font-family:var(--body);
    font-size:.92rem;cursor:pointer;padding:8px 0;margin-bottom:14px;
    display:inline-flex;align-items:center;gap:6px;
  }
  .back:hover{color:var(--text)}
  .back:disabled{opacity:0;pointer-events:none}

  /* Result */
  .dims{display:flex;flex-direction:column;gap:12px;margin:6px 0 26px}
  .dim{
    background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);padding:15px 16px;
    border-left:3px solid var(--line);
  }
  .dim.solido{border-left-color:var(--ok)}
  .dim.medio{border-left-color:var(--accent)}
  .dim.debil{border-left-color:#c94b2e}
  .dim .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:5px}
  .dim .name{
    font-family:var(--display);text-transform:uppercase;letter-spacing:.1em;
    font-size:.78rem;font-weight:600;color:var(--muted)
  }
  .dim .tag{font-family:var(--display);font-weight:600;font-size:.9rem;text-transform:uppercase;letter-spacing:.02em}
  .dim.solido .tag{color:var(--ok)}
  .dim.medio .tag{color:var(--accent)}
  .dim.debil .tag{color:#e06a49}
  .dim p{font-size:.94rem;color:var(--muted);line-height:1.45}

  .verdict{
    background:linear-gradient(180deg,var(--accent-soft),transparent);
    border:1px solid var(--accent-line);
    border-radius:var(--radius);padding:20px 18px;margin-bottom:14px;
  }
  .verdict .k{
    font-family:var(--display);text-transform:uppercase;letter-spacing:.14em;
    font-size:.7rem;color:var(--accent);font-weight:600;margin-bottom:10px
  }
  .verdict p{font-size:1.05rem;line-height:1.5}
  .verdict strong{color:var(--accent);font-weight:700}

  .action{
    background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);padding:18px;margin-bottom:26px;
  }
  .action .k{
    font-family:var(--display);text-transform:uppercase;letter-spacing:.14em;
    font-size:.7rem;color:var(--muted);font-weight:600;margin-bottom:9px;
    display:flex;align-items:center;gap:8px;
  }
  .action .k::before{content:"";width:14px;height:1.5px;background:var(--accent);display:inline-block}
  .action p{font-size:.98rem;line-height:1.5;color:var(--text)}

  .idea{
    text-align:center;color:var(--muted);font-size:.88rem;
    line-height:1.5;margin-bottom:26px;padding:0 4px;
  }
  .idea b{color:var(--text);font-weight:600}

  .hint{color:var(--muted);font-size:.82rem;text-align:center;margin-top:16px}

  @media (prefers-reduced-motion:reduce){
    .screen{animation:none}
    .progress .bar{transition:none}
    .btn{transition:none}
  }
</style>
</head>
<body>
<div class="app">

  <div class="brand" aria-label="Fuerza T">
    <svg viewBox="0 0 40 40" fill="none" aria-hidden="true">
      <path d="M6 8 L34 8 L20 34 Z" stroke="#F2601F" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M11 15 L29 15" stroke="#F4F2EE" stroke-width="2" stroke-linecap="round"/>
      <path d="M20 16 L20 26 M16 16 L24 16" stroke="#F2601F" stroke-width="2.4" stroke-linecap="round"/>
    </svg>
    <span><b>FUERZA&nbsp;T</b>&nbsp;· Autoevaluación</span>
  </div>

  <div class="progress hidden" id="progress"><div class="bar" id="bar"></div></div>

  <div id="root"></div>

</div>

<script>
/* ---------------- Datos ---------------- */
const DIMS = {
  registro:    { name:"Registro" },
  progresion:  { name:"Progresión" },
  planificacion:{ name:"Planificación" }
};
// Orden de prioridad para desempate del cuello de botella
const PRIORITY = ["registro","progresion","planificacion"];

const QUESTIONS = [
  { dim:"registro",     t:"¿Registrás los kilos y las repeticiones de tus ejercicios?" },
  { dim:"registro",     t:"¿Tenés anotado en algún lado qué cargas y reps hacías hace un mes?" },
  { dim:"registro",     t:"¿Podés confirmar que hoy hacés más reps o kilos que hace un mes, manteniendo o mejorando la técnica?" },
  { dim:"progresion",   t:"¿Tenés una forma concreta y fija de medir si estás progresando?" },
  { dim:"progresion",   t:"¿Sabés distinguir tus series efectivas (las exigentes) de las de aproximación o calentamiento?" },
  { dim:"planificacion",t:"¿Mantenés cada ejercicio varias semanas antes de cambiarlo, en vez de rotar seguido?" },
  { dim:"planificacion",t:"¿Tu rutina tiene definidos ejercicios, series y rangos de reps, en lugar de decidir sobre la marcha?" },
  { dim:"planificacion",t:"Cuando te estancás, ¿tenés un criterio para decidir qué cambiar antes de tocar la rutina?" }
];

const ANSWERS = [
  { label:"Sí", v:2 },
  { label:"A veces", v:1 },
  { label:"No", v:0 }
];

/* Devoluciones por dimensión y nivel */
const FEEDBACK = {
  registro:{
    solido:{tag:"Sólido", p:"Sabés qué hacés en cada sesión y te comparás con datos, no de memoria."},
    medio: {tag:"Incompleto", p:"Anotás algunas cosas, pero te faltan datos para comparar con seguridad."},
    debil: {tag:"A ciegas", p:"Hoy no tenés con qué demostrar qué hacías antes ni qué mejoró."}
  },
  progresion:{
    solido:{tag:"Sólida", p:"Tenés una forma clara de medir tu avance y sabés qué series cuentan."},
    medio: {tag:"Irregular", p:"Buscás mejorar, pero sin una medida fija cuesta ver una línea de progreso."},
    debil: {tag:"Sin criterio", p:"No hay una variable concreta que estés intentando superar."}
  },
  planificacion:{
    solido:{tag:"Sólida", p:"Tenés estructura y un criterio para decidir cuándo cambiar algo."},
    medio: {tag:"Mejorable", p:"Hay una base, pero las decisiones todavía dependen mucho del día."},
    debil: {tag:"Sin estructura", p:"Definís sobre la marcha, sin un plan contra el cual medir."}
  }
};

/* Cuello de botella: mensaje global + acción por dimensión */
const BOTTLENECK = {
  registro:{
    global:"Entrenás, pero tenés poca información para saber si estás progresando. Tu principal cuello de botella hoy es el <strong>registro</strong>.",
    action:"Durante las próximas 4 semanas mantené tus ejercicios principales y anotá al menos kilos + repeticiones de cada serie exigente. Prestá atención a que la técnica no empeore cuando subís carga: levantar más ejecutando peor no es progreso. Tu primera meta no es cambiar la rutina, es poder compararte con vos mismo."
  },
  progresion:{
    global:"Tenés con qué medirte, pero no estás siguiendo una variable de progreso de forma consistente. Tu principal cuello de botella hoy es la <strong>progresión</strong>.",
    action:"Definí una variable concreta por ejercicio (una rep más, un poco más de peso sin perder técnica, o mejor ejecución) e intentá superarla la próxima sesión. Y tené claro cuáles son tus series exigentes: son las que realmente cuentan para progresar."
  },
  planificacion:{
    global:"Estás entrenando y buscando mejorar, pero decidís demasiado sobre la marcha. Tu principal cuello de botella hoy es la <strong>planificación</strong>.",
    action:"Dejá por escrito ejercicios, series y rangos de reps antes de entrar al gimnasio, y sostené cada ejercicio varias semanas para poder comparar. Definí de antemano qué vas a cambiar cuando te estanques, para no improvisar en el momento."
  }
};

const ALLSOLID = {
  global:"Tenés las tres capas cubiertas: registrás, seguís tu progreso con criterio y planificás en lugar de improvisar. Eso ya te deja por encima de la mayoría.",
  action:"Tu próximo paso no es corregir un cuello, es afinar: cuidá que la técnica se mantenga cuando subís cargas, y cambiá de ejercicio por datos y no por aburrimiento. Ahí se gana el progreso fino."
};

/* ---------------- Estado (solo en memoria) ---------------- */
let answers = [];   // valores 0/1/2 por pregunta
let step = 0;       // -1 = intro, 0..7 = preguntas, 99 = resultado
const root = document.getElementById('root');
const progress = document.getElementById('progress');
const bar = document.getElementById('bar');

/* ---------------- Render ---------------- */
function setProgress(){
  if(step<0 || step>=99){ progress.classList.add('hidden'); return; }
  progress.classList.remove('hidden');
  bar.style.width = ((step)/QUESTIONS.length*100)+'%';
}

function renderIntro(){
  progress.classList.add('hidden');
  root.innerHTML = `
    <section class="screen">
      <div class="eyebrow">2 minutos · sin registrarte</div>
      <h1>¿Estás entrenando<br>o estás <em>progresando</em>?</h1>
      <p class="lead">Ir al gimnasio y esforzarte no garantiza que sepas si estás mejorando. Respondé 8 preguntas y descubrí qué parte estás haciendo a ciegas.</p>
      <button class="btn btn-primary" id="start">Empezar</button>
      <p class="hint">No pedimos datos personales. Nada se guarda.</p>
    </section>`;
  document.getElementById('start').onclick = ()=>{ step=0; render(); };
}

function renderQuestion(){
  setProgress();
  const q = QUESTIONS[step];
  const opts = ANSWERS.map((a,i)=>`
    <button class="btn opt" data-v="${a.v}">
      <span class="dot"></span><span>${a.label}</span>
    </button>`).join('');
  root.innerHTML = `
    <section class="screen">
      <button class="back" id="back" ${step===0?'disabled':''}>← Anterior</button>
      <div class="qwrap">
        <div class="eyebrow">Pregunta ${step+1} de ${QUESTIONS.length}</div>
        <div class="qtext">${q.t}</div>
        <div class="options">${opts}</div>
      </div>
    </section>`;
  root.querySelectorAll('.opt').forEach(b=>{
    b.onclick = ()=>{
      answers[step] = parseInt(b.dataset.v,10);
      if(step < QUESTIONS.length-1){ step++; render(); }
      else { step=99; render(); }
    };
  });
  document.getElementById('back').onclick = ()=>{ if(step>0){ step--; render(); } };
}

function levelOf(ratio){
  if(ratio >= 0.75) return 'solido';
  if(ratio >= 0.375) return 'medio';
  return 'debil';
}

function computeDims(){
  const acc = {};
  for(const k in DIMS) acc[k] = { key:k, score:0, max:0 };
  QUESTIONS.forEach((q,i)=>{
    acc[q.dim].score += (answers[i]||0);
    acc[q.dim].max += 2;
  });
  for(const k in acc){ acc[k].ratio = acc[k].score/acc[k].max; acc[k].level = levelOf(acc[k].ratio); }
  return acc;
}

function findBottlenecks(acc){
  const min = Math.min(...PRIORITY.map(k => acc[k].ratio));
  const tied = PRIORITY.filter(k => Math.abs(acc[k].ratio - min) < 1e-9);
  return tied; // en orden de prioridad
}

function renderResult(){
  progress.classList.add('hidden');
  const acc = computeDims();
  const tied = findBottlenecks(acc);
  const weakestLevel = acc[tied[0]].level; // nivel del área más débil

  const dimsHtml = PRIORITY.map(k=>{
    const d = acc[k], fb = FEEDBACK[k][d.level];
    return `
      <div class="dim ${d.level}">
        <div class="top">
          <span class="name">${DIMS[k].name}</span>
          <span class="tag">${fb.tag}</span>
        </div>
        <p>${fb.p}</p>
      </div>`;
  }).join('');

  let kLabel, globalHtml, actionHtml;
  if(weakestLevel === 'solido'){
    // incluso el área más débil ya está sólida → no hay cuello real
    kLabel = "Dónde estás parado";
    globalHtml = ALLSOLID.global;
    actionHtml = ALLSOLID.action;
  } else if(tied.length > 1){
    kLabel = "Dónde enfocarte";
    const lead = tied[0]; // prioridad: registro > progresión > planificación
    const names = tied.map(k=>DIMS[k].name.toLowerCase());
    const listed = names.slice(0,-1).join(", ") + " y " + names.slice(-1);
    const cuantas = tied.length===2 ? "dos áreas parejas" : "las tres áreas parejas";
    globalHtml = `Tenés ${cuantas} para trabajar: <strong>${listed}</strong>. Empezá por ${DIMS[lead].name.toLowerCase()}: es la base sobre la que se apoyan las otras.`;
    actionHtml = BOTTLENECK[lead].action;
  } else {
    kLabel = "Dónde enfocarte";
    const k = tied[0];
    globalHtml = BOTTLENECK[k].global;
    actionHtml = BOTTLENECK[k].action;
  }

  root.innerHTML = `
    <section class="screen">
      <div class="eyebrow">Tu resultado</div>
      <div class="dims">${dimsHtml}</div>

      <div class="verdict">
        <div class="k">${kLabel}</div>
        <p>${globalHtml}</p>
      </div>

      <div class="action">
        <div class="k">Tu próximo paso</div>
        <p>${actionHtml}</p>
      </div>

      <p class="idea">Entrenar y progresar no son lo mismo. Para saber si mejorás necesitás poder responder: <b>qué hice, qué mejoró y qué voy a hacer después.</b></p>

      <button class="btn btn-ghost" id="again">Volver a hacer el test</button>
    </section>`;

  document.getElementById('again').onclick = ()=>{ answers=[]; step=-1; render(); };
  window.scrollTo({top:0, behavior:'auto'});
}

function render(){
  if(step<0) renderIntro();
  else if(step>=99) renderResult();
  else renderQuestion();
}

/* init */
step=-1;
render();
</script>
</body>
</html>
